    return `<div class="table-wrap"><table><thead><tr><th>Token / booking</th>${showUser?'<th>Patient</th>':''}<th>Doctor</th><th>Date & time</th><th>Status</th>${readOnly?'':'<th>Actions</th>'}</tr></thead><tbody>${rows.map(a=>`<tr><td><strong class="mono">#${escapeHTML(a.token)}</strong><div class="muted small">${escapeHTML(a.id.toUpperCase())}</div></td>${showUser?`<td><div class="patient-cell"><span class="avatar">${initials(a.patientName)}</span><div><strong>${escapeHTML(a.patientName)}</strong><div class="muted small">${escapeHTML(db.users.find(u=>u.id===a.userId)?.email||'')}</div></div></div>`:''}<td><strong>${escapeHTML(a.doctorName)}</strong><div class="muted small">${escapeHTML(a.specialty)}</div></td><td><strong>${fmtDate(a.date,{month:'short',day:'numeric',year:'numeric'})}</strong><div class="muted small">${fmtTime(a.time)}</div></td><td>${statusTag(a.status)}</td>${readOnly?'':`<td><div class="table-actions">${admin?`<select class="status-select" data-change="appointment-status" data-id="${a.id}" aria-label="Update status for ${escapeHTML(a.token)}">${STATUSES.map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select>`:a.status==='Cancelled'?'<span class="muted small">No actions</span>':a.status==='Completed'?`<button class="btn btn-secondary btn-sm" data-action="reschedule" data-id="${a.id}" title="Reschedule for a medical follow-up">Reschedule follow-up</button>`:`<button class="btn btn-secondary btn-sm" data-action="reschedule" data-id="${a.id}">Reschedule</button><button class="btn btn-danger btn-sm" data-action="cancel-appointment" data-id="${a.id}">Cancel</button>`}</div></td>`}</tr>`).join('')}</tbody></table></div>`;
  }
  function myAppointmentsView(){let rows=patientAppts().slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));if(apptFilter==='upcoming')rows=rows.filter(a=>a.date>=todayISO()&&!['Cancelled','Completed'].includes(a.status));if(apptFilter==='cancelled')rows=rows.filter(a=>a.status==='Cancelled');if(apptFilter==='completed')rows=rows.filter(a=>a.status==='Completed');return `${pageIntro('YOUR VISITS','My appointments','Review your bookings, cancel plans that changed, or select a new available time.','<button class="btn btn-primary" data-action="navigate" data-page="doctors">＋ New appointment</button>')}<div class="toolbar"><select id="my-appt-filter"><option value="all" ${apptFilter==='all'?'selected':''}>All appointments</option><option value="upcoming" ${apptFilter==='upcoming'?'selected':''}>Upcoming</option><option value="completed" ${apptFilter==='completed'?'selected':''}>Completed</option><option value="cancelled" ${apptFilter==='cancelled'?'selected':''}>Cancelled</option></select><span class="tag">${rows.length} records</span></div>${appointmentTable(rows,false,false)}<div class="inline-note">Rescheduling updates the appointment date/time and generates a token for the new doctor/date queue. Cancelled records remain visible for reference.</div>`;}

iv><div><div class="small muted">Time</div><strong>${fmtTime(next.time)}</strong></div></div><div class="inline-note">Only your upcoming queue number is shown here. The prototype does not display the currently active token or the order of other patients.</div></section></div>`;
  }
  function adminOverview(){
    const activeDoctors=db.doctors.filter(d=>d.active).length;

schedules</button></div></section>`;
  }
  function adminAppointmentsView(){
    const allRows=db.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    let rows=allRows;
    if(adminApptSearch)rows=rows.filter(a=>`${a.patientName} ${a.doctorName} ${a.token} ${a.id}`.toLowerCase().includes(adminApptSearch.toLowerCase()));
    const dateOptions=[...new Set(db.appointments.map(a=>a.date))].sort();
    const chosen=queueDateFilter||dateOptions[0]||todayISO();
    const dateRows=db.appointments.filter(a=>a.date===chosen);
    const next=dateRows.filter(a=>a.status==='Waiting').sort((a,b)=>a.doctorName.localeCompare(b.doctorName)||a.queueNo-b.queueNo)[0];
    return `${pageIntro('APPOINTMENT MANAGEMENT','Appointments','Manage bookings and token statuses, and call the next waiting patient from this page.')}<div class="call-next-banner"><div><strong>${next?`Next in queue: #${next.token} · ${escapeHTML(next.patientName)}`:'No waiting patient for this date'}</strong><span>${next?`${escapeHTML(next.doctorName)} · ${fmtDate(next.date)} · ${fmtTime(next.time)}`:'Choose another date or review the appointment list below.'}</span></div><button class="btn btn-primary" data-action="call-next" ${next?'':'disabled'}>Call next patient →</button></div><div class="toolbar"><label class="small muted" for="queue-date-filter">Queue date for calling</label><select id="queue-date-filter">${dateOptions.map(d=>`<option value="${d}" ${d===chosen?'selected':''}>${fmtDate(d,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</option>`).join('')}${!dateOptions.includes(chosen)?`<option selected value="${chosen}">${fmtDate(chosen)}</option>`:''}</select><span class="tag">${dateRows.filter(a=>a.status==='Waiting').length} waiting on selected date</span></div><div class="grid queue-admin-cards" style="margin-bottom:17px">${statCard('Waiting',dateRows.filter(a=>a.status==='Waiting').length,'Waiting to be called','◷','amber')}${statCard('In progress',dateRows.filter(a=>a.status==='Called'||a.status==='In Operation').length,'Called or in operation','↗','')}${statCard('Completed',dateRows.filter(a=>a.status==='Completed').length,'Closed visits','✓','teal')}</div><div class="toolbar"><div class="search-control"><span>⌕</span><input id="admin-appt-search" value="${escapeHTML(adminApptSearch)}" placeholder="Search patient, doctor or token…"></div><span class="tag">${rows.length} appointments</span></div>${appointmentTable(rows,true,true)}<div class="inline-note">Manage all appointment records here. Use “Call next patient” to mark the next waiting appointment as Called, then update its status through In Operation, Completed, or Cancelled in the same appointment list.</div>`;
  }
  function profileView(){const u=currentUser;return `${pageIntro('ACCOUNT SETTINGS','My profile','View or update the personal information attached to your patient account.')}<div class="grid profile-grid"><section class="panel"><div class="profile-banner"><div class="avatar">${initials(u.name)}</div><div><h2>${escapeHTML(u.name)}</h2><p>Patient account · Member since ${new Date(u.createdAt||Date.now()).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</p></div></div><div class="profile-detail"><div><div class="small muted">Email address</div><strong>${escapeHTML(u.email)}</strong></div><div><div class="small muted">Phone number</div><strong>${escapeHTML(u.phone||'Not provided')}</strong></div><div style="margin-top:16px"><div class="small muted">Account role</div><strong>Patient</strong></div><div style="margin-top:16px"><div class="small muted">Your bookings</div><strong>${patientAppts().length} appointment records</strong></div></div></section><section class="panel"><div class="panel-head"><div><h2>Personal information</h2><p>Changes are saved for this browser prototype.</p></div></div><form id="profile-form">${field('Full name','profile-name',u.name,'text','required')}${field('Email address','profile-email',u.email,'email','required')}${field('Phone number','profile-phone',u.phone||'','tel')}<button class="btn btn-primary" type="submit">Save profile</button></form><div class="inline-note">NFR-5 demonstration: the patient interface shows only the signed-in account’s profile and bookings. Browser storage is not a substitute for production authentication or authorization.</div></section></div>`;}
  function coverageView(){const items=[['FR-1','View doctor information and availability','Patient → Find a doctor. Profile, specialty, department, clinic days, available dates and time slots.','Manual check: select a doctor and confirm unavailable slots cannot be selected.'],['FR-2','Book an appointment and generate token','Patient → Find a doctor → choose date/time → confirm. Duplicate active slots are blocked.','Manual check: book an open slot, then try to book the same slot again.'],['FR-3','View upcoming queue number','Patient → Token queue shows the patient’s own upcoming number and appointment status, without displaying other patients or queue order.','Manual check: book an appointment and verify only the patient’s assigned number and status are shown.'],['FR-4','Cancel or reschedule appointment','Patient → My appointments → Cancel / Reschedule; completed visits can be rescheduled for medical follow-up.','Manual check: reschedule a completed appointment to an available time and verify a new Waiting token is assigned.'],['FR-5','Manage doctors, schedules, appointments and queue','Admin → Doctors & schedules / Appointments. Appointment management combines bookings, call-next queue control, and status updates.','Manual check: edit a schedule, open Appointments, call next, and update a booking through each status.'],['NFR-1','Schedule pages load within 3 seconds','Single-page screens render locally without a server round trip.','Measure doctor directory and appointment view under normal network conditions; production hosting still needs testing.'],['NFR-2','Token appears within 2 seconds after booking','Booking confirmation immediately displays the generated token.','Measure from Confirm booking to token confirmation; this prototype is local and does not measure production server latency.'],['NFR-3','First-time booking under 2 minutes without assistance','Search, doctor cards, date/time picker and confirmation form a short booking flow.','Run a timed first-time-user trial; the time target is a requirement, not yet a verified result.'],['NFR-4','Booking and token persist after leaving/refreshing','Demo state is saved to browser localStorage.','Book a slot, refresh the browser, and confirm appointment/token remain. Clearing browser data resets the demo.'],['NFR-5','Users only view/manage their own personal information and bookings','Patient views are filtered by signed-in user; admin controls are visually separated.','Sign in as two different patients and compare profiles/bookings. True security requires server-side authentication and authorization.']];return `${pageIntro('REQUIREMENTS TRACEABILITY','M2 requirement map','A practical mapping from each FR and NFR in the SRS to its prototype screen and a check your team can run.')}<div class="note-box" style="margin-bottom:16px"><strong>How to use this page</strong><br>Each item below identifies what is demonstrated in the clickable prototype and how to verify it. NFR targets that need timed or security testing are not automatically considered passed just because a screen exists.</div><div class="coverage-list">${items.map((x,i)=>`<article class="coverage-item"><div class="coverage-id">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p><p style="margin-top:5px"><b>Verify:</b> ${x[3]}</p></div><div class="coverage-links"><strong>Prototype mapping</strong><br>${x[0].startsWith('FR')?'Functional flow':'Quality / test check'}</div></article>`).join('')}</div><div class="panel section-space"><h2>Scope reminder from M2</h2><p class="muted" style="font-size:12px;line-height:1.7;margin-bottom:0">This MVP demonstrates outpatient booking and queue management only. Online payment, video consultation, diagnosis/treatment recommendations, prescription management, electronic medical records, emergency/ambulance services, insurance claims, pharmacy ordering, external hospital integrations, and AI diagnosis are outside the stated scope.</p></div>`;}
  function renderPage(){
    if(!currentUser)return '';
    if(page==='overview')return currentUser.role==='admin'?adminOverview():patientOverview();
    if(page==='doctors')return findDoctorView(currentUser.role==='admin');
    if(page==='my-appointments'&&currentUser.role==='patient')return myAppointmentsView();
    if(page==='my-queue'&&currentUser.role==='patient')return myQueueView();
    if(page==='profile'&&currentUser.role==='patient')return profileView();
    if(page==='appointments'&&currentUser.role==='admin')return adminAppointmentsView();
    if(page==='coverage')return coverageView();
    page='overview';return currentUser.role==='admin'?adminOverview():patientOverview();
  }
  function render(){ if(!currentUser){loginScreen();return;} if(currentUser.role==='admin'&&['my-appointments','my-queue','profile'].includes(page))page='overview'; if(currentUser.role==='patient'&&['appointments','admin-appointments','admin-queue','token-records'].includes(page))page='overview'; appShell(); }
  function login(user){currentUser=user;try{localStorage.setItem(SESSION_KEY,JSON.stringify({userId:user.id}));}catch(e){}page='overview';render();showToast(`Welcome ${user.name.split(' ')[0]} — you're signed in.`);}
  function logout(){currentUser=null;try{localStorage.removeItem(SESSION_KEY);}catch(e){}page='overview';closeModal();loginScreen();}
  function go(p){page=p;$('#sidebar')?.classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
  function startBooking(doctorId){const d=getDoctor(doctorId);if(!d||!d.active)return;let chosenDate=availableDates(d)[0]||'';let chosenTime='';renderBookingModal(d,chosenDate,chosenTime);}
  function renderBookingModal(d,chosenDate,chosenTime){
    const dates=availableDates(d);if(!dates.includes(chosenDate))chosenDate=dates[0]||'';const slots=chosenDate?d.slots:[];
    const body=`<div class="doctor-card-top" style="margin-bottom:18px"><div class="doctor-avatar ${d.color||''}">${initials(d.name.replace('Dr. ',''))}</div><div><h3 style="font-size:15px;margin:0 0 4px">${escapeHTML(d.name)}</h3><div class="specialty">${escapeHTML(d.specialty)}</div><div class="muted small">${escapeHTML(d.qualification||'')} · ${escapeHTML(d.department)} · ${escapeHTML(d.room)}</div></div></div><p class="muted" style="font-size:12px;line-height:1.6">${escapeHTML(d.bio||'')} Choose an available date and appointment time. Fully booked times are disabled.</p><form id="booking-form" data-doctor="${d.id}"><div class="form-field"><label>1. Select a date</label><div class="date-grid">${dates.slice(0,8).map(date=>`<button type="button" class="date-btn ${date===chosenDate?'selected':''}" data-action="select-booking-date" data-id="${d.id}" data-date="${date}"><strong>${fmtDate(date,{weekday:'short',month:'short',day:'numeric'})}</strong><span>${fullDays[isoDay(date)]}</span></button>`).join('')}</div><input type="hidden" id="booking-date" name="date" value="${chosenDate}"></div><div class="form-field"><label>2. Select an available time</label><div class="slot-grid">${slots.map(time=>{const available=slotsFor(d,chosenDate).includes(time);return `<button type="button" class="slot-btn ${time===chosenTime?'selected':''}" data-action="select-booking-time" data-time="${time}" ${available?'':'disabled'}>${fmtTime(time)}</button>`}).join('')}</div><input type="hidden" id="booking-time" name="time" value="${chosenTime}"></div><div class="note-box"><strong>Automatic token generation</strong><br>After confirmation, the system assigns a token number to your appointment. Your booking and token will be saved in this browser demo.</div></form>`;
    showModal('Book an appointment',body,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="confirm-booking" data-id="${d.id}" ${chosenDate&&chosenTime&&slotsFor(d,chosenDate).includes(chosenTime)?'':'disabled'}>Confirm booking →</button>`,true);
  }
  function refreshBookingSelection(action, value){const form=$('#booking-form');if(!form)return;const d=getDoctor(form.dataset.doctor);const dateInput=$('#booking-date');const timeInput=$('#booking-time');let date=dateInput.value,time=timeInput.value;if(action==='date'){date=value;time='';}else if(action==='time'){time=value;}if(dateInput)dateInput.value=date;if(timeInput)timeInput.value=time;renderBookingModal(d,date,time);}
  function createBooking(doctorId,date,time,oldId=null){const d=getDoctor(doctorId);if(!d||!d.active)throw new Error('This doctor is not available.');if(!d.days.includes(isoDay(date)))throw new Error('This doctor is not scheduled on the selected date.');if(!d.slots.includes(time))throw new Error('Please select one of the offered time slots.');if(!slotsFor(d,date,oldId).includes(time))throw new Error('That time slot has already been booked. Please choose another time.');const queueNo=tokenFor(doctorId,date);if(oldId){const old=db.appointments.find(a=>a.id===oldId);if(!old)throw new Error('Appointment could not be found.');old.doctorId=doctorId;old.doctorName=d.name;old.specialty=d.specialty;old.date=date;old.time=time;old.queueNo=queueNo;old.token=String(queueNo).padStart(3,'0');old.status='Waiting';old.createdAt=new Date().toISOString();persist();return old;}const appt={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),userId:currentUser.id,patientName:currentUser.name,doctorId,doctorName:d.name,specialty:d.specialty,date,time,queueNo,token:String(queueNo).padStart(3,'0'),status:'Waiting',createdAt:new Date().toISOString()};db.appointments.push(appt);persist();return appt;}
  function showBookingSuccess(appt){closeModal();showModal('Appointment confirmed',`<div style="text-align:center;padding:5px 3px 12px"><div class="iconbox" style="margin:0 auto 13px;width:54px;height:54px;font-size:28px;border-radius:18px">✓</div><div class="eyebrow">BOOKING SUCCESSFUL</div><h2 style="font-size:25px;margin:7px 0 8px">Your token is <span style="color:var(--teal)">#${appt.token}</span></h2><p class="muted" style="font-size:12px;line-height:1.6">${escapeHTML(appt.doctorName)} · ${escapeHTML(appt.specialty)}<br>${fmtDate(appt.date,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} at ${fmtTime(appt.time)}</p><div class="note-box" style="text-align:left;margin-top:16px"><strong>Next step</strong><br>Use the Token queue page to view your upcoming queue number and appointment status. Your token status is currently Waiting.</div></div>`,`<button class="btn btn-secondary" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="booking-success-queue">View token queue →</button>`);}
  function rescheduleModal(appt){const d=getDoctor(appt.doctorId);const dates=availableDates(d);let chosenDate=dates.find(date=>slotsFor(d,date,appt.id).length>0)||dates[0]||'';showRescheduleModal(appt,chosenDate,'');}
  function showRescheduleModal(appt,date,time){const d=getDoctor(appt.doctorId);const dates=availableDates(d);if(!dates.includes(date))date=dates[0]||'';const body=`<div class="note-box" style="margin-bottom:16px"><strong>Current booking: #${appt.token}</strong><br>${escapeHTML(appt.doctorName)} · ${fmtDate(appt.date)} at ${fmtTime(appt.time)}</div><form id="reschedule-form" data-id="${appt.id}"><div class="form-field"><label>Choose a new date</label><div class="date-grid">${dates.slice(0,8).map(x=>`<button type="button" class="date-btn ${x===date?'selected':''}" data-action="select-reschedule-date" data-id="${appt.id}" data-date="${x}"><strong>${fmtDate(x,{weekday:'short',month:'short',day:'numeric'})}</strong><span>${fullDays[isoDay(x)]}</span></button>`).join('')}</div><input id="reschedule-date" type="hidden" value="${date}"></div><div class="form-field"><label>Choose a new time</label><div class="slot-grid">${d.slots.map(t=>`<button type="button" class="slot-btn ${t===time?'selected':''}" data-action="select-reschedule-time" data-time="${t}" ${slotsFor(d,date,appt.id).includes(t)?'':'disabled'}>${fmtTime(t)}</button>`).join('')}</div><input id="reschedule-time" type="hidden" value="${time}"></div></form>`;showModal('Reschedule appointment',body,`<button class="btn btn-secondary" data-action="close-modal">Keep current booking</button><button class="btn btn-primary" data-action="confirm-reschedule" data-id="${appt.id}" ${date&&time&&slotsFor(d,date,appt.id).includes(time)?'':'disabled'}>Save new time</button>`,true);}
  function refreshReschedule(action,value){const id=$('#reschedule-form')?.dataset.id;const appt=db.appointments.find(a=>a.id===id);if(!appt)return;let date=$('#reschedule-date').value,time=$('#reschedule-time').value;if(action==='date'){date=value;time='';}else time=value;showRescheduleModal(appt,date,time);}
  function doctorEditor(id=null){const d=id?getDoctor(id):{id:'',name:'',specialty:'General Medicine',department:'General OPD',qualification:'',room:'',bio:'',days:[1,2,3,4,5],slots:['09:00','09:30','10:00','13:00'],color:'',active:true};const body=`<form id="doctor-form" data-id="${id||''}"><div class="form-row">${field('Doctor name','doctor-name',d.name,'text','required')}${field('Specialty','doctor-specialty',d.specialty,'text','required')}</div><div class="form-row">${field('Department','doctor-department',d.department,'text','required')}${field('Room','doctor-room',d.room,'text','required')}</div>${field('Qualification','doctor-qualification',d.qualification,'text')}${field('Short profile','doctor-bio',d.bio,'text')}<div class="form-field"><label>Clinic days</label><div class="check-row">${fullDays.map((day,i)=>`<label class="check-pill"><input type="checkbox" name="doctor-days" value="${i}" ${d.days.includes(i)?'checked':''}>${day.slice(0,3)}</label>`).join('')}</div></div>${field('Appointment times (comma-separated 24-hour time)','doctor-slots',d.slots.join(', '),'text','required placeholder="09:00, 09:30, 10:00"')}<p class="muted small" style="margin-top:-7px">Use 24-hour times such as 09:30 or 14:00. These times will be offered for each selected clinic day.</p></form>`;showModal(id?'Edit doctor & schedule':'Add doctor',body,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="save-doctor">Save doctor</button>`,true);}
  function statusChange(id,status){const appt=db.appointments.find(a=>a.id===id);if(!appt)return;appt.status=status;persist();render();showToast(`Token #${appt.token} status updated to ${status}.`);}
  function callNext(){const chosen=$('#queue-date-filter')?.value||queueDateFilter;const next=db.appointments.filter(a=>a.date===chosen&&a.status==='Waiting').sort((a,b)=>a.doctorName.localeCompare(b.doctorName)||a.queueNo-b.queueNo)[0];if(!next){showToast('No waiting patient found for this date.','warn');return;}next.status='Called';persist();render();showToast(`Token #${next.token} called for ${next.patientName}.`);}

  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
    if(action==='backdrop'&&e.target.classList.contains('modal-backdrop')){closeModal();return;}
    if(action==='close-modal'){closeModal();return;}
    if(action==='show-login'){loginScreen(false);return;}
    if(action==='show-register'){loginScreen(true);return;}
    if(action==='credentials'){showModal('Demo credentials',`<p class="muted" style="font-size:12px">Use either set to explore the different role permissions.</p><div class="note-box"><strong>Patient</strong><br>Email: patient@opd.demo<br>Password: patient123</div><div class="note-box" style="margin-top:10px"><strong>Admin</strong><br>Email: admin@opd.demo<br>Password: admin123</div><p class="small muted">The sign-in flow is simulated and passwords are stored locally for demo purposes only.</p>`,`<button class="btn btn-primary" data-action="close-modal">Got it</button>`);return;}
    if(action==='demo-login'){const user=db.users.find(u=>u.role===b.dataset.role&&(u.email===(b.dataset.role==='admin'?'admin@opd.demo':'patient@opd.demo')));if(user)login(user);return;}
    if(action==='logout'){logout();return;}
    if(action==='navigate'){go(b.dataset.page);return;}
    if(action==='toggle-menu'){$('#sidebar')?.classList.toggle('open');return;}
    if(action==='book-doctor'){const d=getDoctor(b.dataset.id);if(currentUser.role==='admin')doctorEditor(d.id);else startBooking(d.id);return;}
    if(action==='select-booking-date'){refreshBookingSelection('date',b.dataset.date);return;}
    if(action==='select-booking-time'){refreshBookingSelection('time',b.dataset.time);return;}
    if(action==='confirm-booking'){const form=$('#booking-form');const date=$('#booking-date')?.value;const time=$('#booking-time')?.value;try{if(!date||!time)throw new Error('Please choose a date and time first.');const appt=createBooking(b.dataset.id,date,time);showBookingSuccess(appt);}catch(err){showToast(err.message,'warn');}return;}
    if(action==='booking-success-queue'){closeModal();go('my-queue');return;}
    if(action==='cancel-appointment'){const appt=db.appointments.find(a=>a.id===b.dataset.id);if(!appt||appt.userId!==currentUser.id)return;showModal('Cancel appointment',`<p>Are you sure you want to cancel your appointment with <strong>${escapeHTML(appt.doctorName)}</strong> on <strong>${fmtDate(appt.date)} at ${fmtTime(appt.time)}</strong>?</p><div class="note-box">Token #${appt.token} will be marked Cancelled and removed from the active waiting queue. The record will remain in your history.</div>`,`<button class="btn btn-secondary" data-action="close-modal">Keep appointment</button><button class="btn btn-danger" data-action="confirm-cancel" data-id="${appt.id}">Yes, cancel appointment</button>`);return;}
    if(action==='confirm-cancel'){const appt=db.appointments.find(a=>a.id===b.dataset.id);if(appt&&appt.userId===currentUser.id){appt.status='Cancelled';persist();closeModal();render();showToast(`Appointment token #${appt.token} cancelled.`);}return;}
    if(action==='reschedule'){const appt=db.appointments.find(a=>a.id===b.dataset.id);if(appt&&appt.userId===currentUser.id)rescheduleModal(appt);return;}
    if(action==='select-reschedule-date'){refreshReschedule('date',b.dataset.date);return;}
    if(action==='select-reschedule-time'){refreshReschedule('time',b.dataset.time);return;}
    if(action==='confirm-reschedule'){const appt=db.appointments.find(a=>a.id===b.dataset.id);const date=$('#reschedule-date')?.value;const time=$('#reschedule-time')?.value;if(!appt||!date||!time){showToast('Choose a date and time first.','warn');return;}try{const updated=createBooking(appt.doctorId,date,time,appt.id);closeModal();render();showToast(`Appointment rescheduled. Your new token is #${updated.token}.`);}catch(err){showToast(err.message,'warn');}return;}
    if(action==='add-doctor'){doctorEditor();return;}
    if(action==='edit-doctor'){doctorEditor(b.dataset.id);return;}
    if(action==='save-doctor'){const form=$('#doctor-form');if(form)saveDoctorForm(form);return;}
    if(action==='delete-doctor'){const d=getDoctor(b.dataset.id);if(!d)return;const hasActive=db.appointments.some(a=>a.doctorId===d.id&&!['Cancelled','Completed'].includes(a.status));if(hasActive){showModal('Doctor has active appointments',`<p><strong>${escapeHTML(d.name)}</strong> has active appointment/token records.</p><div class="note-box">To protect existing bookings, this prototype will not remove a doctor with active queue records. You can update the schedule or cancel/complete those tokens first.</div>`,`<button class="btn btn-primary" data-action="close-modal">Understood</button>`);return;}showModal('Remove doctor',`<p>Remove <strong>${escapeHTML(d.name)}</strong> from the patient directory?</p><div class="note-box">This action hides the doctor from new bookings. Existing token records are retained.</div>`,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-danger" data-action="confirm-delete-doctor" data-id="${d.id}">Remove doctor</button>`);return;}
    if(action==='confirm-delete-doctor'){const d=getDoctor(b.dataset.id);if(d){d.active=false;persist();closeModal();render();showToast('Doctor removed from the patient directory.');}return;}
    if(action==='call-next'){callNext();return;}
  });

  function saveDoctorForm(form){const fd=new FormData(form);const id=form.dataset.id;const name=String(fd.get('doctor-name')||'').trim();const specialty=String(fd.get('doctor-specialty')||'').trim();const department=String(fd.get('doctor-department')||'').trim();const room=String(fd.get('doctor-room')||'').trim();const qualification=String(fd.get('doctor-qualification')||'').trim();const bio=String(fd.get('doctor-bio')||'').trim();const dayValues=fd.getAll('doctor-days').map(Number);const rawSlots=String(fd.get('doctor-slots')||'');const slots=[...new Set(rawSlots.split(',').map(s=>s.trim()))].filter(Boolean);const validTime=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s);if(!name||!specialty||!department||!room){showToast('Please complete the required doctor fields.','warn');return;}if(!dayValues.length){showToast('Choose at least one clinic day.','warn');return;}if(!slots.length||slots.some(s=>!validTime(s))){showToast('Use valid 24-hour times separated by commas, e.g. 09:00, 09:30.','warn');return;}if(id){const d=getDoctor(id);Object.assign(d,{name,specialty,department,room,qualification,bio,days:dayValues,slots,active:true});}else{db.doctors.push({id:'d'+Date.now().toString(36),name,specialty,department,room,qualification,bio,days:dayValues,slots,active:true,color:['','v2','v3','v4'][db.doctors.length%4]});}persist();closeModal();render();showToast(id?'Doctor details and schedule saved.':'New doctor added to the directory.');}

  document.addEventListener('submit',e=>{
    if(e.target.id==='login-form'){e.preventDefault();const email=$('#login-email').value.trim().toLowerCase();const password=$('#login-password').value;const user=db.users.find(u=>u.email.toLowerCase()===email&&u.password===password);if(!user){showToast('Email or password was not recognized. Try a demo role.','warn');return;}login(user);}
    if(e.target.id==='register-form'){e.preventDefault();const name=$('#reg-name').value.trim();const email=$('#reg-email').value.trim().toLowerCase();const phone=$('#reg-phone').value.trim();const password=$('#reg-password').value;if(!name||!email||password.length<6){showToast('Enter your name, a valid email and a password with at least 6 characters.','warn');return;}if(db.users.some(u=>u.email.toLowerCase()===email)){showToast('An account with that email already exists. Please sign in.','warn');return;}const user={id:'u'+Date.now().toString(36),name,email,password,phone,role:'patient',createdAt:new Date().toISOString()};db.users.push(user);persist();login(user);}
    if(e.target.id==='profile-form'){e.preventDefault();const name=$('#profile-name').value.trim();const email=$('#profile-email').value.trim().toLowerCase();const phone=$('#profile-phone').value.trim();if(!name||!email){showToast('Name and email are required.','warn');return;}if(db.users.some(u=>u.id!==currentUser.id&&u.email.toLowerCase()===email)){showToast('That email is already in use.','warn');return;}currentUser.name=name;currentUser.email=email;currentUser.phone=phone;const ix=db.users.findIndex(u=>u.id===currentUser.id);if(ix>=0)db.users[ix]=currentUser;db.appointments.filter(a=>a.userId===currentUser.id).forEach(a=>a.patientName=name);persist();render();showToast('Your profile has been saved.');}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='specialty-filter'){doctorSpecialty=e.target.value;render();}
    if(e.target.id==='my-appt-filter'){apptFilter=e.target.value;render();}
    if(e.target.id==='queue-date-filter'){queueDateFilter=e.target.value;render();}
    if(e.target.id==='admin-doctor-search'){adminDoctorSearch=e.target.value;render();const input=$('#admin-doctor-search');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}}
    if(e.target.id==='admin-appt-search'){adminApptSearch=e.target.value;render();}
    if(e.target.dataset.change==='appointment-status'){statusChange(e.target.dataset.id,e.target.value);}
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='doctor-search'){doctorSearch=e.target.value;const caret=e.target.selectionStart;const content=$('#page-content');if(content&&page==='doctors'&&currentUser?.role==='patient'){content.innerHTML=findDoctorView(false);const next=$('#doctor-search');next?.focus();next?.setSelectionRange(caret,caret);}}
    if(e.target.id==='global-search'){doctorSearch=e.target.value;if(page!=='doctors'){page='doctors';render();const next=$('#doctor-search');next?.focus();next?.setSelectionRange(doctorSearch.length,doctorSearch.length);}else {const content=$('#page-content');if(content&&currentUser?.role==='patient'){content.innerHTML=findDoctorView(false);const next=$('#doctor-search');next?.focus();next?.setSelectionRange(doctorSearch.length,doctorSearch.length);}}}
    if(e.target.id==='admin-doctor-search'){adminDoctorSearch=e.target.value;const caret=e.target.selectionStart;const content=$('#page-content');if(content&&page==='doctors'&&currentUser?.role==='admin'){content.innerHTML=findDoctorView(true);const next=$('#admin-doctor-search');next?.focus();next?.setSelectionRange(caret,caret);}}
    if(e.target.id==='admin-appt-search'){adminApptSearch=e.target.value;const caret=e.target.selectionStart;const content=$('#page-content');if(content&&page==='appointments'&&currentUser?.role==='admin'){content.innerHTML=adminAppointmentsView();const next=$('#admin-appt-search');next?.focus();next?.setSelectionRange(caret,caret);}}
  });
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();});
  render();
})();
</script>
</body>
</html>
